<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VayuSetu | Why the air is bad, and who can fix it</title>
    <meta name="description" content="Explains air pollution in Delhi NCR from government air monitors, NASA fire satellites and weather data, with advice in ten Indian languages." />
    <meta name="theme-color" content="#f5f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply a saved theme before first paint, so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('vayusetu-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
